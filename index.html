<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Design an animated character for your AI agent and export it as PNG or SVG.">
<title>Dots Lab · design an animated character for your AI agent</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fff'/%3E%3Ccircle cx='16' cy='17.5' r='10' fill='%231ED8C0'/%3E%3Ccircle cx='12.3' cy='16' r='3.5' fill='%23fff'/%3E%3Ccircle cx='19.7' cy='16' r='3.5' fill='%23fff'/%3E%3Ccircle cx='12.7' cy='16.6' r='1.8' fill='%23141416'/%3E%3Ccircle cx='19.3' cy='16.6' r='1.8' fill='%23141416'/%3E%3C/svg%3E">
<meta property="og:title" content="Dots Lab">
<meta property="og:description" content="Design an animated character for your AI agent and export it as PNG or SVG.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une carte unique posée sur un papier pointillé ; le blob au centre, entouré de ses expressions, les formes en arc dessous, puis des panneaux « libellé / contrôle » */
:root{
  --bg:#FFFFFF;--dot:#DEDEDB;--card:#FFFFFF;--well:#F5F5F3;--field:#EAEAE7;--line:#E9E9E6;
  color-scheme:light;--text:#18181B;--text-2:#66666E;--text-3:#71717A;--mc:#1ED8C0;
  --shadow:0 1px 2px rgba(24,24,27,.04),0 30px 70px -30px rgba(24,24,27,.22);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.field{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:64px 32px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.toolbar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;left:16px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;z-index:20;pointer-events:none}
.toolbar>*{pointer-events:auto}
.tb{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 18px -12px rgba(0,0,0,.25);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:transform .3s var(--spring),background-color .15s}
.tb:hover{background:var(--well)}
.tb:active{transform:scale(.96)}
.tb svg{width:16px;height:16px;flex:none}
.tb.icon{width:38px;padding:0;justify-content:center}
.tb.primary{background:var(--text);color:var(--card);border-color:var(--text)}
.tb.primary:hover{background:#2c2c31}
.tb[aria-expanded="true"]{background:var(--well);box-shadow:inset 0 0 0 1px var(--text-3)}
/* bouton scindé : l'action principale à gauche, ses variantes derrière la flèche */
.split{display:flex}
.split .split-main{border-radius:999px 0 0 999px;padding-right:12px}
.split .split-more{width:34px;padding:0;justify-content:center;border-radius:0 999px 999px 0;margin-left:-1px}
.split .primary.split-more{border-left-color:rgba(255,255,255,.22)}
.tb .sz{color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums}
.split .split-more svg{width:14px;height:14px}
.tb.primary[aria-expanded="true"]{background:#2c2c31;box-shadow:none}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;max-height:calc(100dvh - 80px);overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:1px;animation:drop .25s var(--spring)}
.menu .mh{font-size:11px;font-weight:600;color:var(--text-3);padding:6px 10px 4px}
.menu .mh.sep{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.menu button{height:34px;border:0;background:none;border-radius:10px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left;gap:16px}
.menu button:hover,.menu button:focus-visible{background:var(--well)}
.menu button[aria-checked="true"]{font-weight:700}
.menu button[aria-checked="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--text)}
@keyframes drop{from{transform:translateY(-6px)}}
.x{width:30px;height:30px;border-radius:50%;border:0;background:var(--well);display:grid;place-items:center;cursor:pointer;padding:0}
.x svg{width:15px;height:15px}
.panel{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:16px;width:360px;max-width:calc(100% - 32px);max-height:calc(100% - 80px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:6px 16px 14px;z-index:15;animation:slidein .4s var(--spring)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:8px 0 2px}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.panel section{border-top:1px solid var(--line);margin-top:8px}
.panel .sizes{padding:8px 0 4px}
.panel .range{max-width:190px}
.fallback{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:16px;width:300px;max-width:calc(100% - 32px);z-index:18;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:drop .25s var(--spring)}
.fallback .x{position:absolute;top:8px;right:8px}
.fallback p{margin:0 24px;font-size:13px;color:var(--text-2)}
.fallback img{width:160px;height:160px;background:repeating-conic-gradient(#EEE 0 25%,#FFF 0 50%) 0 0/16px 16px;border-radius:14px}
.fallback textarea{width:100%;height:140px;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:0;border-radius:12px;background:var(--well);padding:10px;resize:vertical;color:var(--text)}
.states{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;margin:0 auto}
.badge{height:30px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .3s var(--spring),background-color .15s}
.badge:hover{transform:translateY(-2px)}
.badge[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}
@media (max-width:600px){.toolbar{gap:4px}.tb .t,.tb .sz{display:none}.tb{padding:0;justify-content:center}.tb:not(.split-more){width:38px}.split .split-main{padding:0}.split .split-more{width:32px}}
.page{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* scène : blob + anneau d'expressions */
.stage{position:relative;width:100%;aspect-ratio:1/.8;max-width:100%}
.hit{position:absolute;border-radius:50%;cursor:grab;z-index:2;touch-action:none;transform:translate(-50%,-50%)}
.hit:active{cursor:grabbing}
.tip{position:absolute;left:50%;top:4%;transform:translate(-50%,-6px);background:var(--text);color:var(--card);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;opacity:0;pointer-events:none;white-space:nowrap;z-index:5;transition:opacity .2s,transform .35s var(--spring);font-variant-numeric:tabular-nums}
.tip.on{opacity:1;transform:translate(-50%,0)}
.stage canvas.hero{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bubble{position:absolute;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%);transition:transform .35s var(--spring)}
.bubble canvas{display:block;border-radius:50%;pointer-events:none}
.bubble:hover{transform:translate(-50%,-50%) scale(1.14)}
.bubble[aria-checked="true"]{transform:translate(-50%,-50%) scale(1.1)}
/* halo de sélection : glisse le long de l'arc */
.ind{position:absolute;border-radius:50%;pointer-events:none;background:color-mix(in srgb,var(--mc) 30%,#fff);box-shadow:0 0 0 2px #fff,0 10px 22px -8px color-mix(in srgb,var(--mc) 80%,transparent);transform:translate(-50%,-50%);transition:opacity .2s,background-color .3s}
/* roue de couleurs */
/* barre de contrôle : pastille de couleur | états de l'agent */
.dock{display:flex;align-items:center;gap:18px;width:max-content;align-self:flex-start;position:relative;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);margin:2px auto 0;padding:6px 6px 6px 16px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 30px -18px rgba(0,0,0,.28)}
/* tirage au sort, discret, sous la barre */
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cta .rand{margin-top:0}
.rand{align-self:center;display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 24px 0 18px;margin-top:6px;border:0;border-radius:999px;background:var(--text);color:var(--card);font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 1px 2px rgba(20,20,22,.1),0 12px 24px -12px rgba(20,20,22,.55);transition:transform .3s var(--spring),box-shadow .2s}
.rand.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,20,22,.05),0 10px 22px -14px rgba(20,20,22,.35)}
.rand.ghost:hover{box-shadow:0 1px 2px rgba(20,20,22,.06),0 14px 26px -14px rgba(20,20,22,.4)}
/* bande : les mascottes sauvegardées s'empilent à gauche */
.team{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 30px -18px rgba(0,0,0,.28);max-height:calc(100% - 150px)}
.team-h{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.team-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;padding:2px;scrollbar-width:none}
.team-list:empty{display:none}
.tm{position:relative;flex:none}
.tm-pick{width:60px;height:60px;border:0;border-radius:20px;background:none;padding:0;cursor:pointer;display:grid;place-items:center;transition:background-color .15s}
.tm-pick canvas{display:block;pointer-events:none}
.tm-pick:hover{background:var(--well)}
.tm.active .tm-pick{background:var(--well);box-shadow:inset 0 0 0 1.5px var(--text-3)}
.tm-x{position:absolute;top:0;right:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--card);background:var(--text);color:var(--card);display:grid;place-items:center;padding:0;cursor:pointer;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s var(--spring)}
.tm-x svg{width:10px;height:10px}
.tm:hover .tm-x,.tm-x:focus-visible{opacity:1;transform:none}
.tm.new{animation:tmIn .65s var(--spring)}
.tm.flash .tm-pick{animation:tmFlash .6s ease}
@keyframes tmIn{from{transform:translateX(-30px) scale(.3) rotate(-25deg);opacity:0}}
@keyframes tmFlash{30%{background:color-mix(in srgb,var(--mc) 35%,var(--card))}}
.team-empty{width:60px;height:60px;border:1.5px dashed var(--line);border-radius:20px;display:grid;place-items:center;color:var(--text-3);font-size:22px;font-weight:300}
.team-copy{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--text-2)}
.team-copy:hover{color:var(--text);background:var(--well)}
.team-copy svg{width:15px;height:15px}
@media (max-width:1000px){.team{position:static;transform:none;flex-direction:row;align-self:center;margin:14px auto 0;padding:6px 8px;max-width:calc(100vw - 32px);max-height:none}
  .team-h{writing-mode:vertical-rl;transform:rotate(180deg)}.team-list{flex-direction:row;overflow-x:auto;overflow-y:hidden}}
.rand:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(20,20,22,.1),0 16px 28px -12px rgba(20,20,22,.6)}
.rand:active{transform:scale(.97)}
.rand svg{width:18px;height:18px;transition:transform .5s var(--spring)}
.rand:hover svg{transform:rotate(-20deg)}
.rand:active svg{transform:rotate(200deg) scale(.9)}
.picker{position:relative;width:52px;height:52px;flex:none}
/* pastille de la couleur actuelle ; au survol (ou au toucher) la fleur s'ouvre en tournant */
.pick{width:52px;height:52px;border-radius:50%;border:0;padding:3px;cursor:pointer;background:conic-gradient(from 0deg,#ffb3b3,#ffe08a,#c9f08a,#9ff0c6,#9fe3f5,#b3c4ff,#d9b3ff,#ffb3e0,#ffb3b3);box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px -12px rgba(0,0,0,.35);transition:transform .35s var(--spring),opacity .2s}
.pick i{display:block;width:100%;height:100%;border-radius:50%;background:var(--mc);box-shadow:inset 0 0 0 4px #fff;transition:background-color .3s}
.pick:hover{transform:scale(1.06)}
.picker.open .pick{transform:scale(.8);opacity:0}
.wheel{position:absolute;left:50%;top:50%;width:176px;height:176px;margin:-88px 0 0 -88px;z-index:30;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#ffb3b3,#ffe08a,#c9f08a,#9ff0c6,#9fe3f5,#b3c4ff,#d9b3ff,#ffb3e0,#ffb3b3);box-shadow:0 1px 2px rgba(0,0,0,.06),0 16px 34px -16px rgba(0,0,0,.3);
  opacity:0;transform:scale(.36) rotate(-160deg);pointer-events:none;transition:transform .45s var(--spring),opacity .18s}
.picker.open .wheel{opacity:1;transform:none;pointer-events:auto;transition:transform .7s var(--spring),opacity .2s}
.wheel-in{position:relative;width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.petal{position:absolute;border-radius:50%;border:0;padding:0;cursor:pointer;transform:translate(-50%,-50%) scale(.4);box-shadow:0 1px 3px rgba(0,0,0,.2),inset 0 -2px 4px rgba(0,0,0,.06);transition:transform .35s var(--spring),box-shadow .2s}
/* ouverture : chaque pétale part du centre vers sa place, en léger décalé (--d) */
.picker.open .petal{transform:translate(-50%,-50%) translate(var(--dx),var(--dy));transition:transform .6s var(--spring) var(--d),box-shadow .2s}
.picker.open .petal:hover{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.1);z-index:45!important;transition-delay:0s}
.picker.open .petal[aria-pressed="true"]{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.16);z-index:50!important;box-shadow:0 0 0 3px #fff,0 8px 16px -4px rgba(0,0,0,.35)}
.petal.custom{background:#fff;display:grid;place-items:center}
.petal.custom i{width:44%;height:44%;border-radius:50%;background:conic-gradient(#ff5a5a,#ffc20e,#5ccb77,#1ed8c0,#3f95f5,#9966ff,#ff5aa5,#ff5a5a);box-shadow:0 0 0 2px #fff}
.petal.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0;border-radius:50%}
/* états : sélecteur segmenté ; arrondis concentriques (barre 26 → fond 20 → puce 16, marges de 6 et 4 px) */
.dock .states{position:relative;display:grid;grid-template-columns:repeat(8,auto);gap:2px;margin:0;max-width:none;padding:4px;background:var(--well);border-radius:20px}
/* puce blanche unique qui glisse sous l'état choisi */
.seg-pill{position:absolute;left:0;top:0;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(20,20,22,.1),0 3px 10px -3px rgba(20,20,22,.18);pointer-events:none;z-index:0}
.seg-pill.anim{transition:transform .5s var(--spring),width .5s var(--spring),height .5s var(--spring)}
.dock .badge{position:relative;z-index:1;height:32px;padding:0 12px 0 10px;border:0;border-radius:16px;background:transparent;color:var(--text-2);font-size:12.5px;gap:6px;justify-content:flex-start;transition:background-color .15s,color .15s,box-shadow .2s}
.dock .badge:hover{transform:none;background:rgba(20,20,22,.05);color:var(--text)}
.dock .badge[aria-pressed="true"],.dock .badge[aria-pressed="true"]:hover{background:transparent;color:var(--text)}
.dock .badge.mini{height:auto;width:58px;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:5px 2px 6px;font-size:11px;font-weight:600;border-radius:16px}
.dock .badge.mini canvas{display:block;width:46px;height:46px;pointer-events:none}
.dock .badge.mini span{line-height:1.2;white-space:nowrap}
@media (max-width:390px){.dock{flex-direction:column;padding:10px 6px 6px}}
@media (max-width:620px){.dock{gap:10px;padding-left:10px;left:auto;transform:none;align-self:center;width:auto}.dock .states{grid-template-columns:repeat(4,auto)}.cta{flex-wrap:nowrap;width:100%}.cta .rand{flex:1 1 0;min-width:0;justify-content:center;padding:0 10px;gap:7px;font-size:13.5px}}
.bubble.pop{animation:pop .4s var(--spring)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.8)}100%{transform:translate(-50%,-50%) scale(1)}}

/* formes en arc */
.arc{position:relative;height:118px;margin-top:-26px;overflow:hidden;--fade:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 6%,rgba(0,0,0,.8) 24%,#000 36%,#000 64%,rgba(0,0,0,.8) 76%,rgba(0,0,0,.25) 94%,transparent 100%);-webkit-mask-image:var(--fade);mask-image:var(--fade)}
.shape{position:absolute;left:50%;top:30px;width:82px;height:82px;margin-left:-41px;border:0;border-radius:22px;background:none;padding:0;cursor:pointer;display:grid;place-items:center;transition:background-color .2s}
.shape canvas{display:block;pointer-events:none}
.arc-slot{position:absolute;left:50%;top:30px;width:82px;height:82px;margin-left:-41px;border-radius:22px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}
.arc-label{text-align:center;font-size:12px;font-weight:600;color:var(--text-2);margin-top:-10px}


/* panneaux */
.well-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:10px 0 2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.well-title+.row,.row:first-child{border-top:0}
.row>label,.row>.lbl{font-weight:500;color:var(--text);flex:0 0 auto}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:999px;background:var(--field);gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:999px;border:0;background:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2);transition:background-color .15s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.range{display:flex;align-items:center;gap:10px;flex:1 1 180px;min-width:0;max-width:240px}
.range input{flex:1;min-width:0;accent-color:var(--text)}
.range output{font-size:12px;font-weight:600;color:var(--text-3);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.sizes{display:flex;align-items:flex-end;gap:12px}
.sizes canvas{display:block}
.lineup{display:flex;gap:2px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.preset{flex:0 0 auto;border:0;border-radius:16px;background:none;padding:3px;cursor:pointer;line-height:0;transition:transform .3s var(--spring),background-color .15s}
.preset:hover{background:var(--card);transform:translateY(-3px) rotate(-4deg)}
.preset canvas{display:block;pointer-events:none}
.fallback{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.fallback p{margin:0;font-size:13px;color:var(--text-2)}
.fallback img{width:160px;height:160px;background:repeating-conic-gradient(#EEE 0 25%,#FFF 0 50%) 0 0/16px 16px;border-radius:14px}
.fallback textarea{width:100%;height:140px;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:0;border-radius:12px;background:var(--well);padding:10px;resize:vertical;color:var(--text)}
/* crédit auteur : pastille en haut à gauche, face à la barre d'outils */

<script>
(() => {
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,PI=Math.PI;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dpr=()=>Math.min(window.devicePixelRatio||1,2.5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgba(h,a){const[r,g,b]=hexToRgb(h);return`rgba(${r},${g},${b},${a})`}
function lum(h){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};const[r,g,b]=hexToRgb(h);return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(rx,1e-4),Math.max(ry,1e-4),rot,0,TAU)}
function rrect(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();if(c.primRect){c.primRect(x,y,w,h,r);return}c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arc(x+w-r,y+r,r,-PI/2,0);c.lineTo(x+w,y+h-r);c.arc(x+w-r,y+h-r,r,0,PI/2);c.lineTo(x+r,y+h);c.arc(x+r,y+h-r,r,PI/2,PI);c.lineTo(x,y+r);c.arc(x+r,y+r,r,PI,PI*1.5);c.closePath()}
function sparkle(c,x,y,r,inner=.3){c.beginPath();for(let k=0;k<4;k++){const a=k*PI/2-PI/2,b=a+PI/2;if(!k)c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);c.quadraticCurveTo(x+Math.cos(a+PI/4)*r*inner,y+Math.sin(a+PI/4)*r*inner,x+Math.cos(b)*r,y+Math.sin(b)*r)}c.closePath()}
function pathOf(p){const q=new Path2D();p.forEach(([x,y],i)=>i?q.lineTo(x,y):q.moveTo(x,y));q.closePath();q.pts=p;return q}
function fit(cv,w,h){const d=dpr(),W=Math.round(w*d),H=Math.round(h*d);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}cv.style.width=w+'px';cv.style.height=h+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);return x}

/* ================= formes : aplats, coins très arrondis ================= */
function superE(n,a,b,N){const p=[];for(let i=0;i<N;i++){const t=TAU*i/N,c=Math.cos(t),s=Math.sin(t);p.push([a*Math.sign(c)*Math.pow(Math.abs(c),2/n),b*Math.sign(s)*Math.pow(Math.abs(s),2/n)])}return p}
function param(N,f){const p=[];for(let i=0;i<N;i++)p.push(f(TAU*i/N));return p}
function polar(N,f){const p=[];for(let i=0;i<N;i++){const a=TAU*i/N,r=f(a);p.push([r*Math.sin(a),-r*Math.cos(a)])}return p}
/* polygone à coins arrondis : chaque sommet devient une quadratique */
function rpoly(V,t,n=18){const p=[],L=V.length;for(let i=0;i<L;i++){const P=V[(i-1+L)%L],Q=V[i],R=V[(i+1)%L];
  const A=[Q[0]+(P[0]-Q[0])*t,Q[1]+(P[1]-Q[1])*t],B=[Q[0]+(R[0]-Q[0])*t,Q[1]+(R[1]-Q[1])*t];
  for(let k=0;k<=n;k++){const u=k/n,m=1-u;p.push([m*m*A[0]+2*m*u*Q[0]+u*u*B[0],m*m*A[1]+2*m*u*Q[1]+u*u*B[1]])}}return p}
/* union de disques vue depuis l'origine (nuage, trèfle) */
function discs(C,N){return polar(N,a=>{const dx=Math.sin(a),dy=-Math.cos(a);let r=0;for(const[x,y,R]of C){const b=dx*x+dy*y,d=b*b-(x*x+y*y)+R*R;if(d>=0)r=Math.max(r,b+Math.sqrt(d))}return r})}

/* ================= animation ================= */
/* inspiré des avatars d'agents de Plane : chaque état est une chorégraphie en boucle (phase p ∈ [0,1]),

const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

const span=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const bump=(p,a,b)=>{const v=span(p,a,b);return v>0&&v<1?Math.sin(v*PI):0};
function blinkAmt(p,list,cyc){let o=1;for(const b of list){const m=b.q?.7:1,cN=.09*m/cyc,oN=.14*m/cyc;let d=p-b.c;if(d>.5)d-=1;if(d<-.5)d+=1;

/* chute des yeux en erreur : parabole puis 3 rebonds amortis */
const BH=[.3,.09,.027],BT=1+2*BH.reduce((q,h)=>q+Math.sqrt(h),0);

const CYC={idle:5.5,listen:4,think:5.5,write:3.75,success:3.2,alert:3,error:5.5,sleep:3.4};
const TRK={
  idle:[[0,0,0],[.12,0,0],[.2,.75,-.55,easeBack],[.42,.75,-.55],[.5,-.65,.3,easeBack],[.7,-.65,.3],[.78,0,0,easeBack],[1,0,0]],
  alert:[[0,0,0],[.3,0,0],[.36,-.85,-.1,easeBack],[.5,-.85,-.1],[.56,.85,-.1,easeBack],[.7,.85,-.1],[.78,0,0,easeBack],[1,0,0]],
};
function choreo(id,p,T){

    case'alert':{const pop=easeBack(span(p,.05,.17))*(1-easeIO(span(p,.78,.92)));C.eyePop=1+.28*pop;

/* ================= fond : grille de points ================= */
/* au repos, la même grille fixe qu'en CSS ; quand la mascotte réagit (clic, état, shuffle, équipe), une onde part d'elle :
   elle pousse les points, les assombrit et les relie brièvement au passage du front, teintée de la couleur du dot.
   On ne redessine que pendant une onde. Animations réduites : pas d'onde, grille fixe. */
const field=(()=>{const cv=$('#field'),c=cv.getContext('2d'),G=22,LV=6,ripples=[];
  let W=0,H=0,dpr=1,cols=0,rows=0,px,py,pb,still=false;
  const dotC=hexToRgb(getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()||'#DEDEDB'),GREY=[142,142,150];
  const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k)),rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
  function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    cols=Math.ceil(W/G)+1;rows=Math.ceil(H/G)+1;px=new Float32Array(cols*rows);py=new Float32Array(cols*rows);pb=new Float32Array(cols*rows);still=false}

      for(const rp of ripples){const age=(now-rp.t0)/1000,d=Math.hypot(x0-rp.x,y0-rp.y),w=Math.exp(-(((d-age*420)/30)**2))*rp.a*(1-age/2.6);
        if(w>.01&&d>1){dx+=(x0-rp.x)/d*w*7;dy+=(y0-rp.y)/d*w*7;b=Math.max(b,w*.7)}}
      px[k]=x0+dx;py[k]=y0+dy;pb[k]=b}
    c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    /* traits : seulement sur le front de l'onde, entre voisins tous deux touchés */
    const lines=Array.from({length:LV},()=>[]);
    for(let j=0,k=0;j<rows;j++)for(let i=0;i<cols;i++,k++){if(pb[k]<.05)continue;
      if(i+1<cols){const a=Math.min(pb[k],pb[k+1]);if(a>=.05)lines[Math.min(LV,Math.ceil(a*LV))-1].push(k,k+1)}
      if(j+1<rows){const a=Math.min(pb[k],pb[k+cols]);if(a>=.05)lines[Math.min(LV,Math.ceil(a*LV))-1].push(k,k+cols)}}
    c.strokeStyle=rgb(mix(GREY,tint,.35));c.lineWidth=.75;
    lines.forEach((seg,l)=>{if(!seg.length)return;c.globalAlpha=(l+1)/LV*.5;c.beginPath();for(let q=0;q<seg.length;q+=2){c.moveTo(px[seg[q]],py[seg[q]]);c.lineTo(px[seg[q+1]],py[seg[q+1]])}c.stroke()});

})();
